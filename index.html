<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preisrechner Karneralm</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f1e8;color:#2f2a24;padding:24px}
.wrap{max-width:900px;margin:auto;background:#fffdf9;border:1px solid #ddd3c4;border-radius:16px;padding:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-weight:700;margin-bottom:6px}
input,select{width:100%;padding:10px;border:1px solid #cfc4b4;border-radius:10px;font-size:16px}
button{margin-top:18px;padding:12px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
.primary{background:#66754c;color:white}.secondary{background:#ece4d8}
#result{display:none;margin-top:22px;border:1px solid #ddd3c4;border-radius:12px;padding:18px;background:white}
table{width:100%;border-collapse:collapse}td{padding:9px 0;border-bottom:1px solid #eee6d9}td:last-child{text-align:right}
.total td{font-weight:700;font-size:20px;border-bottom:0}.rules{margin-top:22px;color:#6f675d;line-height:1.5}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Preisrechner Karneralm</h1>
<p>Unverbindliche Preisberechnung für euren Aufenthalt auf unserer Almhütte. Hauptsaison: 20.12. bis 15.01.</p>

<div class="grid">
<div class="field"><label>Anreise</label><input id="anreise" type="date"></div>
<div class="field"><label>Abreise</label><input id="abreise" type="date"></div>
<div class="field"><label>Personen ab 15 Jahren</label><input id="ue15" type="number" min="1" max="11" value="2"></div>
<div class="field"><label>Personen unter 15 Jahren</label><input id="u15" type="number" min="0" max="11" value="0"></div>
<div class="field"><label>Wäscheservice</label><select id="waesche"><option value="0">Nein</option><option value="1" id="waescheJa">Ja</option></select></div>
</div>

<button class="primary" onclick="berechnen()">Gesamtpreis berechnen</button>
<button class="secondary" onclick="resetForm()">Zurücksetzen</button>

<div id="result"><div id="saison"></div><table><tbody id="rows"></tbody></table><div id="warn"></div></div>
<div class="rules" id="regeln"></div>
</div>

<script>
const CONFIG={
  preise:{ns:119,hs:167,zAb15:28,zU15:11,waesche:25},
  reinigung:[{bis:99,preis:100}],
  abgaben:{
    naechtigung:2.30,
    mobilitaet:[
      {ab:"1900-01-01",preis:0.50},
      {ab:"2027-05-01",preis:1.10}
    ]
  },
  belegung:{inklusive:2,maxRegulaer:8,maxAnfrage:11},
  saison:{start:{m:12,t:20},ende:{m:1,t:15}}
};

const euro=v=>v.toLocaleString("de-AT",{style:"currency",currency:"EUR"});
const parseDate=s=>{const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2],12)};
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function isHS(d){
  const m=d.getMonth()+1,t=d.getDate(),s=CONFIG.saison.start,e=CONFIG.saison.ende;
  return (m===s.m&&t>=s.t)||(m===e.m&&t<=e.t);
}
function mob(d){
  let p=0,k=key(d);
  for(const st of CONFIG.abgaben.mobilitaet) if(k>=st.ab) p=st.preis;
  return p;
}
function reinigung(n){
  for(const st of CONFIG.reinigung) if(n<=st.bis) return st.preis;
  return 0;
}

function berechnen(){
  const aV=anreise.value,bV=abreise.value,ab15=+ue15.value,u15n=+u15.value,w=+waesche.value;
  if(!aV||!bV){alert("Bitte Anreise und Abreise eingeben.");return}
  const a=parseDate(aV),b=parseDate(bV),naechte=Math.round((b-a)/86400000);
  if(naechte<1){alert("Abreise muss nach Anreise liegen.");return}
  const personen=ab15+u15n;
  if(personen>CONFIG.belegung.maxAnfrage){alert("Maximal 11 Personen.");return}

  let nsN=0,hsN=0,ns=0,hs=0,mobK=0;
  for(let i=0;i<naechte;i++){
    const d=new Date(a);d.setDate(a.getDate()+i);
    if(isHS(d)){hsN++;hs+=CONFIG.preise.hs}else{nsN++;ns+=CONFIG.preise.ns}
    mobK+=ab15*mob(d);
  }

  const freie=Math.max(0,CONFIG.belegung.inklusive-ab15);
  const zAb15=Math.max(ab15-CONFIG.belegung.inklusive,0)*CONFIG.preise.zAb15*naechte;
  const zU15=Math.max(0,u15n-freie)*CONFIG.preise.zU15*naechte;
  const na=ab15*CONFIG.abgaben.naechtigung*naechte;
  const er=reinigung(personen);
  const wk=w?personen*CONFIG.preise.waesche:0;
  const ges=ns+hs+zAb15+zU15+na+mobK+er+wk;

  saison.textContent=hsN&&nsN?`Nebensaison: ${nsN} Übernachtungen, Hauptsaison: ${hsN} Übernachtungen.`:
    hsN===naechte?"Gesamter Aufenthalt: Hauptsaison.":"Gesamter Aufenthalt: Nebensaison.";

  const data=[
    ["Anzahl Übernachtungen",naechte],
    ["Basispreis Nebensaison",euro(ns)],
    ["Basispreis Hauptsaison",euro(hs)],
    ["Zusatzpersonen ab 15 Jahren",euro(zAb15)],
    ["Personen unter 15 Jahren",euro(zU15)],
    ["Allgemeine Nächtigungsabgabe",euro(na)],
    ["Mobilitätsabgabe",euro(mobK)],
    ["Endreinigung",euro(er)],
    ["Wäscheservice",euro(wk)]
  ];
  rows.innerHTML=data.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")+
    `<tr class="total"><td>Gesamtpreis</td><td>${euro(ges)}</td></tr>`;
  warn.textContent=personen>CONFIG.belegung.maxRegulaer?"Hinweis: Ab 9 Personen nur auf Anfrage.":"";
  result.style.display="block";
}
function resetForm(){
  anreise.value="";abreise.value="";ue15.value=2;u15.value=0;waesche.value=0;result.style.display="none";
}
function regelnSetzen(){
  waescheJa.textContent=`Ja, ${euro(CONFIG.preise.waesche)} pro Person`;
  regeln.innerHTML=`<strong>Preisgrundlage:</strong><br>
  Nebensaison: ${euro(CONFIG.preise.ns)} / Nacht für 2 Personen<br>
  Hauptsaison: ${euro(CONFIG.preise.hs)} / Nacht für 2 Personen<br>
  Zusatzperson ab 15 Jahren: ${euro(CONFIG.preise.zAb15)} / Nacht<br>
  Person unter 15 Jahren: ${euro(CONFIG.preise.zU15)} / Nacht<br>
  Nächtigungsabgabe: ${euro(CONFIG.abgaben.naechtigung)} / Person ab 15 / Nacht<br>
  Mobilitätsabgabe: ${euro(CONFIG.abgaben.mobilitaet[0].preis)}; ab 01.05.2027 ${euro(CONFIG.abgaben.mobilitaet[1].preis)} / Person ab 15 / Nacht<br>
  Endreinigung: ${euro(CONFIG.reinigung[0].preis)} pauschal`;
}
regelnSetzen();
</script>
</body>
</html>
